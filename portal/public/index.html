<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Acceso clientes | Burocracia Zero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/portal.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0a2540"/><path d="M11 14h18M11 20h18M11 26h11" stroke="#16a085" stroke-width="2.6" stroke-linecap="round"/><circle cx="29" cy="27" r="6" fill="#16a085"/><path d="M26.5 27l1.8 1.8 3.2-3.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Burocracia<b>Zero</b>
      </div>
      <p class="muted" style="margin-top:0">Portal de clientes. Accede para subir documentación y consultar tus trámites.</p>

      <div id="alert" class="alert alert--error hidden" role="alert"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn--block" id="submit-btn">Entrar</button>
      </form>

      <p class="muted" style="font-size:.82rem;margin-top:18px;text-align:center">
        ¿No tienes acceso? Escríbenos a <a href="mailto:info@burocraciazero.es">info@burocraciazero.es</a> y te damos de alta.
      </p>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
