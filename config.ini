[general]
# Días de antelación para alertar sobre certificados próximos a caducar
alert_days = 30
# Hora de ejecución diaria de la tarea programada (HH:MM)
check_time = 09:00
# Carpeta donde se descargan las notificaciones de DEHU
download_folder = ~/notificaciones_dehu
# Modo seguro: pide confirmación antes de descargar notificaciones no leídas
# (recomendado: true — descargar una notificación activa plazos legales)
safe_mode = true
# Carpeta de logs diarios
log_folder = logs
# Carpeta de informes generados
report_folder = informes

[dehu]
# URL base del portal DEHU
base_url = https://dehu.redsara.es
# Ruta a tu certificado digital en formato .pfx / .p12
# Expórtalo desde Windows: Administrador de certificados > clic derecho > Exportar
cert_pfx_path =
# Contraseña del certificado .pfx (déjalo vacío si no tiene)
cert_password =
# Tiempo máximo de espera por petición (segundos)
timeout = 30
# Rutas del portal (no modificar salvo que DEHU cambie su estructura)
url_buzon = /es/ciudadano/buzon
url_notificacion = /es/ciudadano/notificacion/{id}

[certificates]
# Almacenes de Windows a escanear (MY = personal, CA = intermedias, ROOT = raíz)
stores = MY,CA,ROOT
# Emisores reconocidos como certificados españoles
known_issuers = FNMT-RCM,AC DNIE,ACCV,CAMERFIRMA,IZENPE,ANF AC,CATCERT
