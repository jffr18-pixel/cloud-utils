      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="0.6" stop-color="#14457a"/>
      <stop offset="1" stop-color="#0e7a63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="260" fill="#16a085" opacity="0.18"/>
  <circle cx="120" cy="560" r="220" fill="#14457a" opacity="0.4"/>

  <!-- Logo -->
